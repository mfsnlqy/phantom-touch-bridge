[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-touch-bridge"
version = "0.2.0"
description = "Local bridge for Intiface-first device control with a custom backend compatibility path."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Open Source Plan Workspace" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "buttplug>=1.0.0,<2.0.0",
  "bleak>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]
build = [
  "pyinstaller>=6.11,<7.0",
]

[project.scripts]
phantom-touch-bridge = "intiface_bridge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
